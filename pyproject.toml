[project]
name = "python-server"
version = "0.1.0"
description = "AI-powered Python backend with speech, vision, and 3D model generation."
readme = "README.md"
requires-python = ">=3.10"

[tool.uv.dependencies]
# 🌐 AI & LLM APIs
litellm = ">=1.63.11"
openai = ">=1.66.3"
anthropic = ">=0.49.0"
google-ai-generativelanguage = ">=0.6.16"
google-cloud-aiplatform = ">=1.84.0"
google-cloud-storage = ">=2.19.0"
google-cloud-bigquery = ">=3.30.0"

# 🏗 Web 框架
fastapi = ">=0.115.11"
starlette = ">=0.46.1"
uvicorn = ">=0.34.0"
websockets = ">=12.0"  # Tripod3D WebSocket 通信

# 🔊 音频处理
pydub = ">=0.25.1"
pedalboard = ">=0.9.16"

# 🔥 Firebase SDK（Tripod3D 依赖）
firebase-admin = ">=6.3.0"

# 🔧 工具库
python-dotenv = ">=1.0.1"
requests = ">=2.32.3"
tqdm = ">=4.67.1"
pillow = ">=11.1.0"
numpy = ">=2.2.3"
